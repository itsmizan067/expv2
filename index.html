<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>EXP Tracker - Income &amp; Expense Management</title>
  <meta name="description"
    content="EXP Tracker - Progressive Web App for managing personal income and expenses with offline support, auto cloud sync, role-based admin approval, and activity auditing." />
  <meta property="og:title" content="EXP Tracker" />
  <meta property="og:description"
    content="EXP Tracker - Progressive Web App for managing personal income and expenses with offline support, auto cloud sync, role-based admin approval, and activity auditing." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EXP Tracker" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script>
    // Apply theme before first paint (prevents a light flash). Key must match ThemeContext.
    (function () {
      try {
        var t = localStorage.getItem('exp-tracker-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>

<body class="bg-slate-50 dark:bg-[#0b1220] text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
