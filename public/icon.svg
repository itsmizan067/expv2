<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" stroke="rgba(255,255,255,0.06)" stroke-width="4" fill="none" />
  
  <!-- Wallet / Vault Base Shape -->
  <rect x="120" y="150" width="272" height="212" rx="28" fill="#1e293b" stroke="#334155" stroke-width="6" />
  
  <!-- Flap -->
  <path d="M 120 190 Q 256 220 392 190" stroke="#334155" stroke-width="5" fill="none" />
  
  <!-- Up Arrow (Income) -->
  <g transform="translate(180, 240)">
    <circle cx="20" cy="20" r="32" fill="url(#accentGrad)" />
    <path d="M 20 8 L 32 22 L 24 22 L 24 34 L 16 34 L 16 22 L 8 22 Z" fill="#ffffff" />
  </g>
  
  <!-- Down Arrow (Expense) -->
  <g transform="translate(280, 240)">
    <circle cx="20" cy="20" r="32" fill="url(#roseGrad)" />
    <path d="M 20 32 L 8 18 L 16 18 L 16 6 L 24 6 L 24 18 L 32 18 Z" fill="#ffffff" />
  </g>
  
  <!-- Top Badge Currency -->
  <circle cx="256" cy="140" r="28" fill="#10b981" stroke="#0f172a" stroke-width="4" />
  <text x="256" y="150" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
</svg>
